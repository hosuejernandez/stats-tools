<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stats Tools</title>
  <meta name="description" content="Statistics tools for students: describe data, make graphs, regression, normal distributions, and simulation-based significance.">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232a78d6'/%3E%3Crect x='7' y='16' width='4' height='9' rx='1' fill='white'/%3E%3Crect x='14' y='9' width='4' height='16' rx='1' fill='white'/%3E%3Crect x='21' y='13' width='4' height='12' rx='1' fill='white'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>Stats <span>Tools</span></h1>
      <nav class="tabs" role="tablist" aria-label="Tools">
        <button role="tab" data-view="one-var">One Variable</button>
        <button role="tab" data-view="two-var">Two Variables</button>
        <button role="tab" data-view="categorical">Categorical</button>
        <button role="tab" data-view="normal">Normal</button>
        <button role="tab" data-view="simulation">Simulation</button>
      </nav>
    </header>

    <section class="view" id="one-var" role="tabpanel" hidden></section>
    <section class="view" id="two-var" role="tabpanel" hidden></section>
    <section class="view" id="categorical" role="tabpanel" hidden></section>
    <section class="view" id="normal" role="tabpanel" hidden></section>
    <section class="view" id="simulation" role="tabpanel" hidden></section>
  </div>
  <div id="tip" role="tooltip"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
